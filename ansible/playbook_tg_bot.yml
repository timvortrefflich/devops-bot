---
- name: Prepare all hosts
  hosts: all
  become: yes

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - git
          - openssh-server
        state: present


- name: Configure PostgreSQL master
  hosts: db_master
  become: yes

  tasks:
    - name: Install PostgreSQL on master
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present

    - name: Detect PostgreSQL version
      ansible.builtin.shell: "psql -V | awk '{print $3}' | cut -d. -f1"
      register: pg_version_cmd
      changed_when: false

    - name: Set PostgreSQL paths
      ansible.builtin.set_fact:
        pg_version: "{{ pg_version_cmd.stdout }}"
        pg_conf_dir: "/etc/postgresql/{{ pg_version_cmd.stdout }}/main"
        pg_data_dir: "/var/lib/postgresql/{{ pg_version_cmd.stdout }}/main"

    - name: Configure listen_addresses
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_dir }}/postgresql.conf"
        regexp: "^#?listen_addresses\\s*="
        line: "listen_addresses = '*'"

    - name: Configure wal_level
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_dir }}/postgresql.conf"
        regexp: "^#?wal_level\\s*="
        line: "wal_level = replica"

    - name: Configure max_wal_senders
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_dir }}/postgresql.conf"
        regexp: "^#?max_wal_senders\\s*="
        line: "max_wal_senders = 10"

    - name: Configure hot_standby
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_dir }}/postgresql.conf"
        regexp: "^#?hot_standby\\s*="
        line: "hot_standby = on"

    - name: Copy pg_hba.conf
      ansible.builtin.template:
        src: pg_hba.conf
        dest: "{{ pg_conf_dir }}/pg_hba.conf"
        owner: postgres
        group: postgres
        mode: "0640"

    - name: Restart PostgreSQL master
      ansible.builtin.service:
        name: postgresql
        state: restarted
        enabled: yes

    - name: Create database user
      ansible.builtin.shell: |
        psql -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ db_user }}'" | grep -q 1 || \
        psql -c "CREATE USER {{ db_user }} WITH PASSWORD '{{ db_password }}';"
      become_user: postgres
      changed_when: false

    - name: Create database
      ansible.builtin.shell: |
        psql -tc "SELECT 1 FROM pg_database WHERE datname='{{ db_name }}'" | grep -q 1 || \
        createdb -O {{ db_user }} {{ db_name }}
      become_user: postgres
      changed_when: false

    - name: Create replication user
      ansible.builtin.shell: |
        psql -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ db_repl_user }}'" | grep -q 1 || \
        psql -c "CREATE ROLE {{ db_repl_user }} WITH REPLICATION LOGIN PASSWORD '{{ db_repl_password }}';"
      become_user: postgres
      changed_when: false


- name: Configure PostgreSQL replica
  hosts: db_replica
  become: yes

  tasks:
    - name: Install PostgreSQL on replica
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present

    - name: Detect PostgreSQL version on replica
      ansible.builtin.shell: "psql -V | awk '{print $3}' | cut -d. -f1"
      register: pg_version_cmd
      changed_when: false

    - name: Set PostgreSQL paths on replica
      ansible.builtin.set_fact:
        pg_version: "{{ pg_version_cmd.stdout }}"
        pg_conf_dir: "/etc/postgresql/{{ pg_version_cmd.stdout }}/main"
        pg_data_dir: "/var/lib/postgresql/{{ pg_version_cmd.stdout }}/main"

    - name: Stop PostgreSQL replica before basebackup
      ansible.builtin.service:
        name: postgresql
        state: stopped

    - name: Check standby signal
      ansible.builtin.stat:
        path: "{{ pg_data_dir }}/standby.signal"
      register: standby_signal

    - name: Remove old PostgreSQL data on replica
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: absent
      when: not standby_signal.stat.exists

    - name: Recreate PostgreSQL data directory
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"
      when: not standby_signal.stat.exists

    - name: Copy pgpass for replication
      ansible.builtin.template:
        src: pgpass
        dest: /var/lib/postgresql/.pgpass
        owner: postgres
        group: postgres
        mode: "0600"
      when: not standby_signal.stat.exists

    - name: Create base backup from master
      ansible.builtin.shell: |
        PGPASSFILE=/var/lib/postgresql/.pgpass pg_basebackup \
        -h {{ hostvars[groups['db_master'][0]].ansible_host }} \
        -U {{ db_repl_user }} \
        -D {{ pg_data_dir }} \
        -Fp -Xs -P -R
      become_user: postgres
      when: not standby_signal.stat.exists

    - name: Start PostgreSQL replica
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: yes


- name: Deploy Telegram bot
  hosts: bot
  become: yes

  tasks:
    - name: Install bot packages
      ansible.builtin.apt:
        name:
          - git
          - python3
          - python3-pip
          - python3-venv
        state: present

    - name: Clone bot code from GitHub
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ bot_app_dir }}"
        version: "{{ repo_branch }}"
        force: yes

    - name: Create Python virtual environment and install requirements
      ansible.builtin.pip:
        requirements: "{{ bot_app_dir }}/bot/requirements.txt"
        virtualenv: "{{ bot_app_dir }}/venv"
        virtualenv_command: python3 -m venv

    - name: Create .env for bot
      ansible.builtin.copy:
        dest: "{{ bot_app_dir }}/bot/.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          TOKEN={{ bot_token }}

          RM_HOST={{ hostvars[groups['db_master'][0]].ansible_host }}
          RM_PORT={{ hostvars[groups['db_master'][0]].ansible_port | default(22) }}
          RM_USER={{ hostvars[groups['db_master'][0]].ansible_user }}
          RM_PASSWORD={{ hostvars[groups['db_master'][0]].ansible_password }}

          DB_HOST={{ hostvars[groups['db_master'][0]].ansible_host }}
          DB_PORT=5432
          DB_DATABASE={{ db_name }}
          DB_USER={{ db_user }}
          DB_PASSWORD={{ db_password }}

    - name: Create systemd service for Telegram bot
      ansible.builtin.copy:
        dest: /etc/systemd/system/tg-bot.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Telegram bot from Ansible practice
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory={{ bot_app_dir }}/bot
          ExecStart={{ bot_app_dir }}/venv/bin/python {{ bot_app_dir }}/bot/bot.py
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Start Telegram bot
      ansible.builtin.systemd:
        name: tg-bot
        state: started
        enabled: no
